<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Click In Box</title>
  </head>
  <body>
    <header>
      <a href="index.html"></a>
      <img src="assets/logo/logo.png" alt="Click In Box" />
    </header>
    <main>
      <section class="user-profile">
        <img
          src="assets/images/stories/story-01.jpeg"
          alt="Foto de perfil do usuário"
        />

        <div class="user-info">
          <h1>Nome da pessoa</h1>
          <p>email@exemplo.com</p>
        </div>
      </section>
      <section class="user-boxes">
        <h2>Minhas Boxes</h2>

        <div class="user-boxes-list">
          <a class="user-box-card" href="box.html">
            <img
              src="assets/images/stories/story-01.jpeg"
              alt="Box da Mariazinha"
            />

            <div class="user-box-info">
              <h3>Mariazinha</h3>
              <p>15 anos</p>
              <span>Coautora</span>
            </div>
          </a>

          <a class="user-box-card" href="box.html">
            <img
              src="assets/images/stories/story-02.jpeg"
              alt="Box de João e Ana"
            />

            <div class="user-box-info">
              <h3>João e Ana</h3>
              <p>Casamento</p>
              <span>Convidada</span>
            </div>
          </a>
        </div>
      </section>
    </main>
    <footer class="footer">
      <img src="assets/logo/logo.png" alt="Click In Box" />
    </footer>
  </body>
</html>
