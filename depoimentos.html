<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/style.css" />
    <title>Click In Box</title>
  </head>
  <body>
    <header>
      <a href="/">
        <img src="/assets/logo/logo.png" alt="Click In Box" />
      </a>
    </header>
    <main>
      <section class="testimonials">
        <div class="testimonials-header">
          <h1>Depoimentos</h1>
          <a class="box-return" href="box.html"> Mariazinha, 15 anos </a>
        </div>
        <div class="testimonial-form">
          <label for="testimonial-text">Deixe seu depoimento</label>

          <textarea
            id="testimonial-text"
            name="testimonial"
            rows="6"
            placeholder="Escreva uma mensagem para Mariazinha..."
          ></textarea>

          <button id="testimonial-submit" type="button">
            Enviar depoimento
          </button>
        </div>
        <div id="testimonials-list"></div>
      </section>
    </main>
    <footer class="footer">
      <img src="/assets/logo/logo.png" alt="Click In Box" />
    </footer>
    <script src="/js/app.js"></script>
  </body>
</html>
