<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/style.css" />
    <title>Click In Box</title>
  </head>
  <body>
    <header>
      <a href="/">
        <img src="/assets/logo/logo.png" alt="Click In Box" />
      </a>
    </header>
    <main>
      <section class="album">
        <div class="album-header">
          <h1>Álbum</h1>
          <a id="box-return" class="box-return" href="#"> Mariazinha, 15 anos </a>
        </div>
        <div class="album-upload">
          <label for="album-photo">Adicionar foto</label>

          <input id="album-photo" type="file" accept="image/*" />
        </div>
        <div class="album-grid"></div>
      </section>
    </main>
    <footer class="footer">
      <img src="/assets/logo/logo.png" alt="Click In Box" />
    </footer>
    <script src="/js/app.js"></script>
  </body>
</html>
