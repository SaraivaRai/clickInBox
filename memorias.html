<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/style.css" />
    <title>Click In Box</title>
  </head>
  <body>
    <header>
      <a href="index.html">
        <img src="/assets/logo/logo.png" alt="Click In Box" />
      </a>
    </header>
    <main>
      <section class="memories">
        <div class="memories-header">
          <h1>Memórias</h1>
          <a class="box-return" href="box.html"> Mariazinha, 15 anos </a>
        </div>

        <div class="memory-form">
          <label class="sr-only" for="memory-title"> Título da memória </label>

          <select id="memory-title" name="memory-title">
            <option value="" selected disabled>
              Escolha um tipo de lembrança
            </option>

            <option value="historia-engracada">Uma história engraçada</option>

            <option value="momento-inesquecivel">
              Um momento inesquecível
            </option>

            <option value="aventura">Uma aventura que vivemos</option>

            <option value="duvido">duvido</option>

            <option value="infancia">Uma lembrança da infância</option>

            <option value="nunca-vou-esquecer">
              Uma coisa que nunca vou esquecer
            </option>

            <option value="so-a-gente-entende">
              Um momento que só a gente entende
            </option>

            <option value="outro">Outro...</option>
          </select>
          <input
            id="memory-custom-title"
            type="text"
            placeholder="Dê um nome para essa lembrança"
          />

          <label class="sr-only" for="memory-text"> Conte essa história </label>

          <textarea
            id="memory-text"
            rows="6"
            placeholder="Conte uma lembrança com Mariazinha..."
          ></textarea>

          <div class="memory-actions">
            <label for="memory-file">Adicionar foto</label>
            <input id="memory-file" type="file" accept="image/*" />

            <button id="memory-submit" type="button">
              Compartilhar memória
            </button>
          </div>
        </div>
        <div class="memories-list"></div>
      </section>
    </main>
    <footer class="footer">
      <img src="/assets/logo/logo.png" alt="Click In Box" />
    </footer>
    <script src="/js/app.js"></script>
  </body>
</html>
