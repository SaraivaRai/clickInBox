<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/assets/icons/icon-192.png" />
    <link rel="stylesheet" href="/css/style.css" />
    <title>Click In Box</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Allura&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <a href="/" class="header-logo">
        <img src="/assets/logo/logo.png" alt="Click In Box" />
      </a>

      <div class="header-account" id="header-account">
        <button type="button" id="btn-login">Entrar</button>
      </div>
    </header>
    <main>
      <section class="hero">
        <img class="hero-logo" src="/assets/logo/logo.png" alt="Click In Box" />

        <h1>Histórias que merecem ser <span>lembradas.</span></h1>
        <div class="hero-box">
          <img src="/assets/images/hero/box.png" alt="Click In Box" />
        </div>
      </section>
      <section class="stories">
        <h2>BOX</h2>
        <div id="home-boxes-list" class="stories-list"></div>
        <div class="stories-list stories-demo-list">
          <article>
            <a href="#">
              <img
                src="/assets/images/stories/story-02.jpeg"
                alt="Casal de noivos abraçados, com trajes de casamento"
              />
              <div class="story-info">
                <h3>Isaac e Deborah</h3>
                <p>Casamento</p>
              </div>
            </a>
          </article>
          <article>
            <a href="#">
              <img
                src="/assets/images/stories/story-03.jpeg"
                alt="Noivos saindo da capela ao fim do casamento e trocando um beijo"
              />
              <div class="story-info">
                <h3>AC e WB</h3>
                <p>Casamento</p>
              </div>
            </a>
          </article>
          <article>
            <a href="#">
              <img
                src="/assets/images/stories/story-04.jpeg"
                alt="Aniversariante com um vestido branco, sorrindo para uma foto na cabine de fotos"
              />
              <div class="story-info">
                <h3>Cristiane de vasconcelos</h3>
                <p>18 anos</p>
              </div>
            </a>
          </article>
        </div>
      </section>
    </main>
    <script src="/js/home.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
