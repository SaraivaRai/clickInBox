<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="icon" type="image/png" href="/assets/icons/icon-192.png">
    <title>Click In Box</title>
  </head>
  <a href="/login.html">Entrar</a>

  <body>
    <header>
      <a href="/">
        <img src="/assets/logo/logo.png" alt="Click In Box" />
      </a>
    </header>

    <main>
      <div class="box-layout">
        <section class="box-profile">
          <img id="box-imagem-principal" src="" alt="" />

          <div class="box-info">
            <h1 id="box-nome">Mariazinha</h1>
            <p id="box-evento">15 anos</p>
          </div>

          <section class="box-music">
            <audio controls id="box-musica">
              <source id="box-musica-source" src="" type="audio/mpeg" />
              Seu navegador não suporta reprodução de áudio.
            </audio>
          </section>
        </section>

        <section class="box-gavetas">
          <h2>Explore esta Box</h2>

          <div class="gavetas-list">
            <a id="link-album" class="gaveta" href="#">
              <h3>Álbum</h3>
            </a>

            <a id="link-depoimentos" class="gaveta" href="#">
              <h3>Depoimentos</h3>
            </a>

            <a id="link-pessoas" class="gaveta" href="#">
              <h3>Pessoas</h3>
            </a>

            <a id="link-memorias" class="gaveta" href="#">
              <h3>Memórias</h3>
            </a>
          </div>
        </section>
      </div>
      <section class="box-participants">
        <h2>Pessoas desta história</h2>

        <div class="participants-list" id="box-participants"></div>
      </section>
    </main>
    <footer class="footer">
      <img src="/assets/logo/logo.png" alt="Click In Box" />
    </footer>
    <script src="/js/app.js"></script>
  </body>
</html>
