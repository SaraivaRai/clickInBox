<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Click In Box</title>
  </head>
  <div
    id="g_id_onload"
    data-client_id="699415164315-cv5d4hbqoirdbnkeo04kdbmk7vi8vuj0.apps.googleusercontent.com"
    data-callback="handleGoogleCredential"
  ></div>

  <div class="g_id_signin" data-type="standard"></div>
  <script src="https://accounts.google.com/gsi/client" async></script>

  <script>
    async function handleGoogleCredential(response) {
      const resposta = await fetch("/api/auth/google", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          credential: response.credential,
        }),
      });

      const dados = await resposta.json();
      console.log(dados);
    }
  </script>
  <body>
    <header>
      <a href="index.html">
        <img src="assets/logo/logo.png" alt="Click In Box" />
      </a>
    </header>

    <main>
      <div class="box-layout">
        <section class="box-profile">
          <img
            src="assets/images/stories/story-01.jpeg"
            alt="Mariazinha sorrindo durante sua festa"
          />

          <div class="box-info">
            <h1>Mariazinha</h1>
            <p>15 anos</p>
          </div>

          <section class="box-music">
            <audio controls>
              <source src="assets/audio/nossa-musica.mp3" type="audio/mpeg" />
              Seu navegador não suporta reprodução de áudio.
            </audio>
          </section>
        </section>

        <section class="box-gavetas">
          <h2>Explore esta Box</h2>

          <div class="gavetas-list">
            <a class="gaveta" href="/boxes/1/album">
              <h3>Álbum</h3>
            </a>

            <a class="gaveta" href="/boxes/1/depoimentos">
              <h3>Depoimentos</h3>
            </a>

            <a class="gaveta" href="/boxes/1/pessoas">
              <h3>Pessoas</h3>
            </a>

            <a class="gaveta" href="/boxes/1/memorias">
              <h3>Memórias</h3>
            </a>
          </div>
        </section>
      </div>
      <section class="box-participants">
        <h2>Pessoas desta história</h2>

        <div class="participants-list">
          <div class="participant">
            <img src="assets/images/stories/story-01.jpeg" alt="Mariazinha" />

            <div class="participant-info">
              <h3>Mariazinha</h3>
              <span>Protagonista</span>
            </div>
          </div>
          <div class="participant">
            <img src="assets/images/stories/story-02.jpeg" alt="Ana" />

            <div class="participant-info">
              <h3>Ana</h3>
              <span>Coautora</span>
            </div>
          </div>

          <div class="participant">
            <img src="assets/images/stories/story-03.jpeg" alt="João" />

            <div class="participant-info">
              <h3>João</h3>
              <span>Convidado</span>
            </div>
          </div>

          <div class="participant">
            <img src="assets/images/stories/story-04.jpeg" alt="Carla" />

            <div class="participant-info">
              <h3>Carla</h3>
              <span>Madrinha</span>
            </div>
          </div>
          <div class="participant">
            <img src="assets/images/stories/story-03.jpeg" alt="João" />

            <div class="participant-info">
              <h3>João</h3>
              <span>Convidado</span>
            </div>
          </div>

          <div class="participant">
            <img src="assets/images/stories/story-04.jpeg" alt="Carla" />

            <div class="participant-info">
              <h3>Carla</h3>
              <span>Madrinha</span>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer class="footer">
      <img src="assets/logo/logo.png" alt="Click In Box" />
    </footer>
  </body>
</html>
