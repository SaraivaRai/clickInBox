<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="icon" type="image/png" href="/assets/icons/icon-192.png" />
    <title>Click In Box</title>
  </head>
  <body>
    <header>
      <a href="/" class="header-logo">
        <img src="/assets/logo/logo.png" alt="Click In Box" />
      </a>

      <div class="header-account" id="header-account">
        <button type="button" id="btn-login">Entrar</button>
      </div>
    </header>

    <!-- HERO INTERNO DA BOX -->
    <section class="box-internal-hero">
      <div class="box-hero-photo">
        <img id="box-imagem-principal" class="box-hero-image" src="" alt="" />
      </div>

      <div class="box-hero-overlay">
        <span class="box-hero-heart" aria-hidden="true">♡</span>

        <div class="box-internal-music">
          <audio id="box-musica">
            <source id="box-musica-source" src="" type="audio/mpeg" />
            Seu navegador não suporta reprodução de áudio.
          </audio>

          <button
            type="button"
            class="music-play-button"
            id="music-play-button"
            aria-label="Reproduzir música"
          >
            ▶
          </button>

          <span class="box-internal-music-label">Nossa Música</span>
        </div>

        <div
          class="box-info box-return-trigger"
          role="link"
          tabindex="0"
          aria-label="Voltar para a Box"
        >
            <img id="box-apresentacao-imagem" class="box-presentation-art" src="" alt="" hidden />
            <h1 id="box-nome"></h1>

          <div class="box-event-line">
            <span></span>
            <p id="box-evento">15 anos</p>
            <span></span>
          </div>

          <blockquote>
            “Alguns momentos merecem durar mais que uma noite.”
          </blockquote>

          <span class="box-hero-small-heart" aria-hidden="true">♥</span>
        </div>
      </div>
    </section>

    <nav class="box-internal-nav" aria-label="Áreas da Box">
      <a id="link-album" href="#" class="box-internal-nav-item">
        <img src="/assets/icons/Festa.png" alt="" />
        <span>Festa</span>
      </a>

      <a id="link-depoimentos" href="#" class="box-internal-nav-item">
        <img src="/assets/icons/Depoimento.png" alt="" />
        <span>Depoimentos</span>
      </a>

      <a id="link-memorias" href="#" class="box-internal-nav-item is-active">
        <img src="/assets/icons/Memoria.png" alt="" />
        <span>Memórias</span>
      </a>

      <a id="link-pessoas" href="#" class="box-internal-nav-item">
        <img src="/assets/icons/Pessoas.png" alt="" />
        <span>Pessoas</span>
      </a>
    </nav>

    <main>
      <section class="memories">
        <div class="memories-header">
          <div class="memories-heading">
            <h1>Memórias</h1>
            <p>Nossas histórias</p>
          </div>

          <button
            type="button"
            class="memory-create-button"
            id="memory-create-button"
          >
            Deixe uma memória
          </button>

          <a
            id="box-return"
            class="box-return"
            href="#"
            aria-label="Voltar para a Box"
          ></a>
        </div>

        <div class="memory-form" hidden>
          <label class="sr-only" for="memory-title"> Título da memória </label>

          <select id="memory-title" name="memory-title">
            <option value="" selected disabled>
              Escolha um tipo de lembrança
            </option>

            <option value="historia-engracada">Uma história engraçada</option>

            <option value="momento-inesquecivel">
              Um momento inesquecível
            </option>

            <option value="aventura">Uma aventura que vivemos</option>

            <option value="duvido">duvido</option>

            <option value="infancia">Uma lembrança da infância</option>

            <option value="nunca-vou-esquecer">
              Uma coisa que nunca vou esquecer
            </option>

            <option value="so-a-gente-entende">
              Um momento que só a gente entende
            </option>

            <option value="outro">Outro...</option>
          </select>
          <input
            id="memory-custom-title"
            type="text"
            placeholder="Dê um nome para essa lembrança"
          />

          <label class="sr-only" for="memory-text"> Conte essa história </label>

          <textarea
            id="memory-text"
            rows="6"
            placeholder="Conte uma lembrança especial..."
          ></textarea>

          <div class="memory-actions">
            <label for="memory-file">Adicionar foto</label>
            <input id="memory-file" type="file" accept="image/*" />
            <p id="memory-file-feedback"></p>

            <button id="memory-submit" type="button">
              Compartilhar memória
            </button>
            <p id="memory-feedback"></p>
          </div>
        </div>
        <div class="memories-list"></div>
      </section>

      <!-- PESSOAS ESPECIAIS -->
      <section class="box-participants">
        <h2><span aria-hidden="true">♡</span>Pessoas especiais nesta história</h2>
        <div class="participants-list" id="box-participants"></div>
      </section>
    </main>

    <script src="/js/app.js"></script>
  </body>
</html>
