<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/style.css" />
    <title>Click In Box</title>
  </head>
  <body>
    <header>
      <a href="/">
        <img src="/assets/logo/logo.png" alt="Click In Box" />
      </a>
    </header>
    <main>
      <section class="user-profile">
        <img
          id="perfil-foto"
          src="/assets/images/stories/story-01.jpeg"
          alt="Foto de perfil do usuário"
        />

        <div class="user-info">
          <h1 id="perfil-nome">Nome da pessoa</h1>
          <p id="perfil-email">email@exemplo.com</p>
          <button id="btn-logout" class="logout-button">Sair da conta</button>
        </div>
      </section>
      <section class="user-boxes">
        <h2>Minhas Boxes</h2>
        <div class="user-boxes-list" id="minhas-boxes"></div>
      </section>
    </main>
    <footer class="footer">
      <img src="/assets/logo/logo.png" alt="Click In Box" />
    </footer>
    <script src="/js/app.js"></script>
  </body>
</html>
