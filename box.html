<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Click In Box</title>
  </head>
  <body>
    <header>
      <a href="index.html"></a>
      <img src="assets/logo/logo.png" alt="Click In Box" />
    </header>

    <main>
      <section class="box-profile">
        <img
          src="assets/images/stories/story-01.jpeg"
          alt="Mariazinha sorrindo durante sua festa"
        />

        <div class="box-info">
          <h1>Mariazinha</h1>
          <p>15 anos</p>
        </div>
        <section class="box-music">
            <audio controls>
            <source src="assets/audio/nossa-musica.mp3" type="audio/mpeg" />
            Seu navegador não suporta reprodução de áudio.
          </audio>
        </section>
      </section>

      <section class="box-gavetas">
        <h2>Explore esta Box</h2>

        <div class="gavetas-list">
          <a class="gaveta" href="#">
            <h3>Álbum</h3>
          </a>

          <a class="gaveta" href="#">
            <h3>Depoimentos</h3>
          </a>
          
          <a class="gaveta" href="#">
            <h3>Pessoas</h3>
          </a>

          <a class="gaveta" href="#">
            <h3>Memórias</h3>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
