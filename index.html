<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css">
    <title>Click In Box</title>
  </head>
  <body>
    <header>
      <img src="assets/logo/logo.png" alt="Click In Box" />
    </header>
    <main>
      <section class="hero">
        <h1>Histórias que merecem ser lembradas.</h1>
        <div class="hero-photos">
          <img
            src="assets/images/hero/hero-01.jpg"
            alt="Amigas em uma festa de 15 anos"
          />
          <img
            src="assets/images/hero/hero-02.jpg"
            alt="Casal se beijando em uma festa junina"
          />
          <img
            src="assets/images/hero/hero-03.jpg"
            alt="Noivos acompanhados de um casal de amigos"
          />
          <img
            src="assets/images/hero/hero-04.jpg"
            alt="Debutante com duas amigas"
          />
        </div>
      </section>
      <section class="stories">
        <h2>Histórias</h2>
        <div class="stories-list">
        <article>
          <a href="#">
            <img
              src="assets/images/stories/story-01.jpeg"
              alt="Aniversariante com um vestido roxo, tirando a foto sozinha"
            />
            <div class="story-info">
            <h3>Mariazinha</h3>
            <p>15 anos</p>
            </div>
          </a>
        </article>
        <article>
          <a href="#">
            <img
              src="assets/images/stories/story-02.jpeg"
              alt="Casal de noivos abraçados, com trajes de casamento"
            />
            <div class="story-info">
            <h3>Isaac e Deborah</h3>
            <p>Casamento</p>
            </div>
          </a>
        </article>
        <article>
          <a href="#">
            <img
              src="assets/images/stories/story-03.jpeg"
              alt="Noivos saindo da capela ao fim do casamento e trocando um beijo"
            />
            <div class="story-info">
            <h3>AC e WB</h3>
            <p>Casamento</p>
            </div>
          </a>
        </article>
        <article>
          <a href="#">
            <img
              src="assets/images/stories/story-04.jpeg"
              alt="Aniversariante com um vestido branco, sorrindo para uma foto na cabine de fotos"
            />
            <div class="story-info">
            <h3>Sarah</h3>
            <p>18 anos</p>
            </div>
          </a>
        </article>
        </div>
      </section>
    </main>
  </body>
</html>
